[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-cli"
version = "0.1.0"
description = "ReAct 命令行 Agent：三层记忆 + 审批 + MCP + 验证钩子的可复用 Harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "tiktoken>=0.7.0",
    "mcp>=2.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
# 安装后可直接敲 agent-cli（等价 python agent_cli.py）
agent-cli = "agent_cli:main"

[tool.setuptools]
# agent/ 与 webui/ 是包（webui 含 static 静态资源）；root 模块单独列出
packages = ["agent", "agent.tools", "webui"]
py-modules = ["agent_cli", "config"]

[tool.setuptools.package-data]
webui = ["static/*"]
